name: CI - Vanilla Bazel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Indicates where the aspect CLI should look for .aspect/config.json
  ASPECT_WORKSPACE: ${{ github.workspace }}

jobs:
  semantic-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Mac/Windows smoke tests - only e2e/smoke
  # Only run on main branch (not PRs) to minimize minutes (billed at 10X and 2X respectively)
  # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#included-storage-and-minutes
  smoke:
    if: github.ref_name == 'main' || contains(github.head_ref, 'macos') || contains(github.head_ref, 'windows')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: e2e/smoke
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # Skip --config=aspect-cloud on Windows and fork PRs. The aspect CLI, which
      # the config uses as its credential helper, does not support Windows, and
      # fork PRs do not have access to secrets.
      BAZEL_ASPECT_FLAGS: ${{ matrix.os != 'windows-latest' && secrets.ASPECT_OSS_API_TOKEN != '' && '--config=aspect-cloud' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.os }}-smoke
          repository-cache: true

      - uses: aspect-build/setup-aspect@b1e9d142e86f63c10d603304daa22bf80492e24c # v2026.25.1
        if: matrix.os != 'windows-latest'
        with:
          aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
          disk-cache: false
          repository-cache: false

      # Bazel fails the build rather than create the directory the
      # aspect-exec-log group writes into.
      - run: mkdir -p .aspect/generated
        shell: bash

      - name: bazel test //...
        shell: bash
        run: |
          bazel test ${{ env.BAZEL_ASPECT_FLAGS }} \
            --test_tag_filters=-skip-on-bazel7 \
            --build_tag_filters=-skip-on-bazel7 \
            //...

  # Provides a stable job name for branch protection rules, gating on all matrix jobs above.
  conclusion:
    needs: [smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.smoke.result }}" == "success" || "${{ needs.smoke.result }}" == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
